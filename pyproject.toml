[project]
name = "projeto-teste"
version = "0.1.0"
description = "Projeto teste para ambiente profissional"
authors = [
    { name = "Lucas Seixas", email = "lseixasd@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
